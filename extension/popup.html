<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperBiceps</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            width: 400px;
            min-height: 500px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #5a6fd8 0%, #6a4190 100%);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .section-card {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: white;
            transition: box-shadow 0.2s ease;
        }
        .section-card:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .input-field {
            border: 1px solid #d1d5db;
            border-radius: 6px;
            transition: border-color 0.2s ease;
        }
        .input-field:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .status-message {
            border-radius: 6px;
            font-weight: 500;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <div class="gradient-bg text-white p-4 rounded-b-lg">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center">
                <span class="text-lg">🎙</span>
            </div>
            <div>
                <h1 class="text-lg font-bold">PaperBiceps</h1>
                <p class="text-sm opacity-90">AI-Powered Research Assistant</p>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div style="padding: 16px; display: flex; flex-direction: column; gap: 16px;">
        <!-- Current URL Display -->
        <div class="section-card" style="padding: 16px;">
            <label style="display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 8px;">📄 Current Page</label>
            <div style="font-size: 12px; color: #6b7280; word-break: break-all; background: #f9fafb; padding: 8px; border-radius: 4px; border: 1px solid #e5e7eb;" id="currentUrl">Loading...</div>
        </div>

        <!-- Podcast Generation Section -->
        <div class="section-card" style="padding: 20px;">
            <h2 style="font-size: 16px; font-weight: 600; color: #1f2937; margin-bottom: 8px; display: flex; align-items: center;">
                <span style="margin-right: 8px;">🎧</span>
                Generate Podcast
            </h2>
            <p style="font-size: 13px; color: #6b7280; margin-bottom: 16px;">Convert this page into an audio podcast</p>
            <button id="generatePodcastBtn" class="btn-primary" style="color: white; padding: 12px 24px; border-radius: 6px; width: 100%; font-weight: 500; font-size: 14px;">
                <span id="podcastBtnText">🎙️ Generate Podcast</span>
                <span id="podcastSpinner" style="display: none;">⏳ Generating...</span>
            </button>
        </div>

        <!-- Voice Explanations Section -->
        <div class="section-card" style="padding: 20px;">
            <h2 style="font-size: 16px; font-weight: 600; color: #1f2937; margin-bottom: 8px; display: flex; align-items: center;">
                <span style="margin-right: 8px;">🔊</span>
                Voice Explanations
            </h2>
            <p style="font-size: 13px; color: #6b7280; margin-bottom: 16px;">Get AI explanations for specific parts</p>
            
            <!-- Query Input -->
            <div style="display: flex; flex-direction: column; gap: 16px;">
                <div>
                    <label style="display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 8px;">What would you like explained?</label>
                    <input type="text" id="queryInput" placeholder="e.g., 'Explain figure 1.2', 'Read abstract', 'Explain conclusion'" 
                           class="input-field" style="width: 100%; padding: 12px; font-size: 13px;">
                </div>
                
                <div style="display: flex; gap: 12px;">
                    <button id="explainBtn" class="btn-primary" style="color: white; padding: 12px 24px; border-radius: 6px; flex: 1; font-weight: 500; font-size: 14px;">
                        <span id="explainBtnText">🔍 Explain</span>
                        <span id="explainSpinner" style="display: none;">⏳ Processing...</span>
                    </button>
                    <button id="clearBtn" style="background: #e5e7eb; color: #374151; padding: 12px 16px; border-radius: 6px; font-weight: 500; font-size: 14px; border: none; cursor: pointer; transition: background-color 0.2s ease;" onmouseover="this.style.backgroundColor='#d1d5db'" onmouseout="this.style.backgroundColor='#e5e7eb'">
                        🗑️ Clear
                    </button>
                </div>
            </div>
        </div>

        <!-- Audio Player Section -->
        <div id="audioPlayerSection" class="section-card" style="padding: 20px; display: none;">
            <h3 style="font-size: 16px; font-weight: 600; color: #1f2937; margin-bottom: 12px; display: flex; align-items: center;">
                <span style="margin-right: 8px;">🎵</span>
                Audio Player
            </h3>
            <div style="display: flex; flex-direction: column; gap: 16px;">
                <audio id="audioPlayer" controls style="width: 100%; border-radius: 6px;">
                    Your browser does not support the audio element.
                </audio>
                <div style="display: flex; gap: 12px;">
                    <button id="downloadBtn" style="background: #10b981; color: white; padding: 12px 24px; border-radius: 6px; flex: 1; font-weight: 500; font-size: 14px; border: none; cursor: pointer; transition: background-color 0.2s ease;" onmouseover="this.style.backgroundColor='#059669'" onmouseout="this.style.backgroundColor='#10b981'">
                        📥 Download
                    </button>
                    <button id="stopBtn" style="background: #ef4444; color: white; padding: 12px 24px; border-radius: 6px; font-weight: 500; font-size: 14px; border: none; cursor: pointer; transition: background-color 0.2s ease;" onmouseover="this.style.backgroundColor='#dc2626'" onmouseout="this.style.backgroundColor='#ef4444'">
                        ⏹️ Stop
                    </button>
                </div>
            </div>
        </div>

        <!-- Status Messages -->
        <div id="statusMessage" style="display: none; padding: 12px; border-radius: 6px; font-size: 13px; font-weight: 500;"></div>

        <!-- Footer -->
        <div style="text-align: center; font-size: 11px; color: #6b7280; padding: 16px; border-top: 1px solid #e5e7eb; background: #f9fafb; margin: -16px -16px 0 -16px; border-radius: 0 0 8px 8px;">
            <p style="font-weight: 500; margin: 0;">🎙️ Powered by PaperBiceps AI</p>
            <p style="margin: 4px 0 0 0;">Right-click on any page for quick podcast generation</p>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
